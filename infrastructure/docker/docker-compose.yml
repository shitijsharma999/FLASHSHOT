services:
  postgres:
    image: postgres:18-alpine
    container_name: flashshot-postgres
    environment:
      POSTGRES_DB: flashshot
      POSTGRES_USER: flashshot
      POSTGRES_PASSWORD: flashshot_dev
    ports:
      - "5432:5432"
    volumes:
      - flashshot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashshot -d flashshot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flashshot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flashshot_pg_data:
